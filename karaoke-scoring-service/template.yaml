AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AWS SAM Template for Karaoke Scoring Service on AWS Lambda with Mangum & API Gateway.

Globals:
  Function:
    Timeout: 60
    MemorySize: 2048
    Environment:
      Variables:
        ENVIRONMENT: production
        LOG_LEVEL: INFO
        AWS_REGION: !Ref "AWS::Region"
        S3_BUCKET_NAME: !Ref S3BucketName
        S3_BUCKET_VOCALS: !Ref S3BucketName
        S3_BUCKET_SONGS: !Ref S3BucketName
        DATABASE_URL: !Ref DatabaseUrl

Parameters:
  S3BucketName:
    Type: String
    Default: open-karaoke-bucket
    Description: Name of S3 bucket storing vocal recordings and master instrumental tracks.

  DatabaseUrl:
    Type: String
    NoEcho: true
    Default: postgresql://postgres@database-1-instance-1.c5gog2m2mroy.ap-southeast-1.rds.amazonaws.com:5432/postgres
    Description: Connection string for AWS RDS PostgreSQL database (IAM database auth enabled).

Resources:
  # API Gateway HTTP API
  KaraokeApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - "*"

  # Container-based Lambda Function
  KaraokeScoringFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Architectures:
        - x86_64
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - rds-db:connect
              Resource: "*"
        - S3ReadPolicy:
            BucketName: !Ref S3BucketName
      Events:
        RootPath:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
            ApiId: !Ref KaraokeApi
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: ./
      DockerTag: v1.0.0

Outputs:
  ApiEndpoint:
    Description: "API Gateway Endpoint URL for Karaoke Scoring Service"
    Value: !Sub "https://${KaraokeApi}.execute-api.${AWS::Region}.amazonaws.com/prod/"

  LambdaFunctionArn:
    Description: "Karaoke Scoring Lambda Function ARN"
    Value: !GetAtt KaraokeScoringFunction.Arn
